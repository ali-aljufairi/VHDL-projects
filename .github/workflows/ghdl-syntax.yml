name: ghdl-syntax

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl

      - name: Run syntax check
        run: |
          chmod +x ./scripts/ghdl_syntax_check.sh
          ./scripts/ghdl_syntax_check.sh
